# Containers must run as a non-root user. This makes the runAsNonRoot posture
# already set in k8s/deployment.yaml and k8s/redis.yaml *mandatory* at admission,
# so a future careless edit (or an automated change) cannot quietly reintroduce
# root containers.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenonroot
  annotations:
    description: >-
      Requires runAsNonRoot: true at the pod or container level for every
      container in a Pod, Deployment, or StatefulSet.
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenonroot

        # Resolve the pod spec whether the reviewed object is a bare Pod or a
        # workload controller that carries a pod template.
        pod_spec = input.review.object.spec.template.spec {
          input.review.object.spec.template.spec
        } else = input.review.object.spec {
          true
        }

        all_containers[c] { c := pod_spec.containers[_] }
        all_containers[c] { c := pod_spec.initContainers[_] }

        pod_non_root {
          pod_spec.securityContext.runAsNonRoot == true
        }

        violation[{"msg": msg}] {
          c := all_containers[_]
          not pod_non_root
          not c.securityContext.runAsNonRoot == true
          msg := sprintf("container '%v' must run as non-root: set runAsNonRoot: true at the pod or container level", [c.name])
        }
