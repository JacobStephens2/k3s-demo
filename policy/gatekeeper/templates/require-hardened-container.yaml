# The container hardening triad already present on every workload here:
# allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, and dropping ALL
# Linux capabilities. Together these shrink the blast radius of a compromised
# container. This template makes the triad a hard admission requirement.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirehardenedcontainer
  annotations:
    description: >-
      Requires allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, and
      capabilities.drop including ALL on every container.
spec:
  crd:
    spec:
      names:
        kind: K8sRequireHardenedContainer
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirehardenedcontainer

        pod_spec = input.review.object.spec.template.spec {
          input.review.object.spec.template.spec
        } else = input.review.object.spec {
          true
        }

        containers[c] { c := pod_spec.containers[_] }

        violation[{"msg": msg}] {
          c := containers[_]
          not c.securityContext.allowPrivilegeEscalation == false
          msg := sprintf("container '%v' must set allowPrivilegeEscalation: false", [c.name])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not c.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("container '%v' must set readOnlyRootFilesystem: true", [c.name])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not drops_all(c)
          msg := sprintf("container '%v' must drop ALL capabilities", [c.name])
        }

        drops_all(c) {
          c.securityContext.capabilities.drop[_] == "ALL"
        }
