apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-demo
  labels:
    app.kubernetes.io/name: k3s-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # zero-downtime: never drop below desired ready count
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k3s-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k3s-demo
    spec:
      serviceAccountName: k3s-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/jacobstephens2/k3s-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: k3s-demo-config
            - secretRef:
                name: k3s-demo-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
