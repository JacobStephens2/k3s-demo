apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k3s-demo

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

# Pin the image tag here rather than editing the Deployment.
images:
  - name: ghcr.io/jacobstephens2/k3s-demo
    newTag: "1.0.0"
