# Scales 2->6 replicas on CPU. Needs metrics-server (bundled with k3s). Drive it
# with: hey -z 60s http://k3s-demo.localhost/burn?ms=500
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: k3s-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: k3s-demo
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Tuned for a demo: scale up fast, scale back down quickly (~30s) instead of the
  # default 5-minute stabilization, so the pod count returns to 2 soon after load.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
